<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Nome do Fogo: Sagrados e Profanos</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fantasy: {
                            darkest: '#050505',
                            red: '#7a0000',
                            gold: '#cba135'
                        }
                    },
                    fontFamily: {
                        title: ['"Cinzel Decorative"', 'serif'],
                        body: ['"Lora"', 'serif'],
                    },
                    backgroundImage: {
                        'fire-gradient': 'radial-gradient(circle at center, #2a0505 0%, #050505 100%)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: #e5d9b5;
            overflow: hidden; /* Previne rolagem na landing page */
        }

        /* Efeitos de brilho e textura no texto */
        .text-glow {
            text-shadow: 0 0 15px rgba(203, 161, 53, 0.4), 0 0 30px rgba(122, 0, 0, 0.6);
        }

        /* Estilo interativo do botão */
        .btn-glow {
            transition: all 0.4s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(122, 0, 0, 0.8), inset 0 0 15px rgba(203, 161, 53, 0.2);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
            border-color: #cba135;
        }

        /* Sistema de Partículas (Fagulhas) */
        .ember {
            position: absolute;
            background-color: #ff6600;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            animation: float-up linear infinite;
        }
        @keyframes float-up {
            0% { transform: translateY(0) scale(1); opacity: 1; box-shadow: 0 0 10px #ff6600, 0 0 20px #ff0000; }
            100% { transform: translateY(-100vh) scale(0.2); opacity: 0; }
        }

        /* Vinheta escura nas bordas para aumentar a imersão */
        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle, transparent 40%, #000000 120%);
            z-index: 10;
        }
    </style>
</head>
<body class="font-body min-h-screen w-full bg-fantasy-darkest selection:bg-fantasy-red selection:text-white flex items-center justify-center">

    <!-- Container Principal da Landing Page -->
    <div class="relative w-full h-screen flex flex-col items-center justify-center bg-fire-gradient">
        
        <!-- Recipiente para as partículas (script irá popular) -->
        <div id="particles" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>
        <div class="vignette"></div>
        
        <!-- Conteúdo Central -->
        <div class="relative z-20 text-center px-6 max-w-5xl flex flex-col items-center">
            
            <h2 class="font-title text-fantasy-gold text-xs sm:text-sm md:text-lg tracking-[0.4em] mb-6 uppercase opacity-80">
                Última Atualização: 09-2026
            </h2>
            
            <h1 class="font-title text-5xl sm:text-6xl md:text-8xl text-white font-black mb-4 text-glow leading-tight tracking-wide">
                Em Nome do Fogo
            </h1>

            <p class="font-title text-fantasy-red text-xl sm:text-2xl md:text-4xl tracking-widest mb-20 uppercase font-bold text-glow">
                Sagrados e Profanos
            </p>
            <a href="file:///C:/Users/lucas/OneDrive/Documentos/Projetos/Projetos%20de%20Programa%C3%A7%C3%A3o/frontend/livro.html">
                <button class="group relative px-12 py-4 font-title text-lg md:text-xl font-bold tracking-widest text-fantasy-gold uppercase bg-black/40 border-2 border-fantasy-red overflow-hidden btn-glow rounded-sm cursor-pointer backdrop-blur-sm">
                    <span class="relative z-10 transition-colors duration-300 group-hover:text-white">Acessar</span>
                    <div class="absolute inset-0 h-full w-0 bg-gradient-to-r from-fantasy-red to-[#4a0000] transition-all duration-500 ease-out group-hover:w-full z-0 opacity-80"></div>
                </button>
            </a>
        </div>
    </div>

    <script>
        // Lógica para criar fagulhas (embers) flutuando no fundo
        const particlesContainer = document.getElementById('particles');
        
        function createEmbers() {
            // Número de fagulhas simultâneas
            const numEmbers = 45; 
            
            for (let i = 0; i < numEmbers; i++) {
                let ember = document.createElement('div');
                ember.className = 'ember';
                
                // Propriedades aleatórias para tamanho, posição e velocidade
                let size = Math.random() * 4 + 1; // Tamanho entre 1 e 5px
                let left = Math.random() * 100; // Posição horizontal
                let duration = Math.random() * 8 + 4; // Duração da animação entre 4 e 12s
                let delay = Math.random() * 5; // Atraso para início
                
                ember.style.width = `${size}px`;
                ember.style.height = `${size}px`;
                ember.style.left = `${left}%`;
                ember.style.bottom = `-10px`; // Começa um pouco abaixo da tela
                ember.style.animationDuration = `${duration}s`;
                ember.style.animationDelay = `${delay}s`;
                
                // Variação de cor (mais amarelo ou mais vermelho)
                if (Math.random() > 0.7) {
                    ember.style.backgroundColor = '#cba135'; // Dourado
                    ember.style.boxShadow = '0 0 10px #cba135, 0 0 20px #ff6600';
                }
                
                particlesContainer.appendChild(ember);
            }
        }

        // Inicia o efeito visual ao carregar a página
        window.onload = function() {
            createEmbers();
        };
    </script>
</body>
</html>

# URL de conexão com o SQL Server (substitua pelos dados do seu servidor/banco)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SeuBancoDeDados;encrypt=true;trustServerCertificate=true;

# Usuário e senha do SQL Server
spring.datasource.username=seu_usuario
spring.datasource.password=sua_senha

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
